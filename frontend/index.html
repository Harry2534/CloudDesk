
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudDesk | IT Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div>
                <h1>CloudDesk</h1>
                <p>IT Support Ticket Management System</p>
            </div>
            <div id="user-panel" class="user-panel" hidden>
                <span id="user-info"></span>
                <button id="logout-btn" type="button">Log Out</button>
            </div>
        </div>
    </header>

    <main>
        <!-- Authentication -->
        <section id="auth-section" class="auth-section">
            <div class="auth-card">
                <h2 id="auth-heading">Log In</h2>
                <p id="auth-description">
                    Sign in to manage your support tickets.
                </p>

                <form id="login-form">
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email"
                           autocomplete="email" required>

                    <label for="login-password">Password</label>
                    <input id="login-password" type="password"
                           autocomplete="current-password" required>

                    <button type="submit">Log In</button>
                </form>

                <form id="register-form" hidden>
                    <label for="register-name">Full Name</label>
                    <input id="register-name" type="text"
                           maxlength="100" autocomplete="name" required>

                    <label for="register-email">Email</label>
                    <input id="register-email" type="email"
                           autocomplete="email" required>

                    <label for="register-password">Password</label>
                    <input id="register-password" type="password"
                           minlength="8" maxlength="128"
                           autocomplete="new-password" required>

                    <p class="form-hint">
                        New accounts are registered as Employees.
                    </p>

                    <button type="submit">Create Account</button>
                </form>

                <p id="auth-message" class="message" role="status"></p>

                <button id="toggle-auth" class="link-button" type="button">
                    Don't have an account? Register
                </button>
            </div>
        </section>

        <!-- Logged-in application -->
        <div id="app-section" hidden>
            <section class="dashboard">
                <div class="stat-card">
                    <h3>Total Tickets</h3>
                    <p id="total-tickets">0</p>
                </div>
                <div class="stat-card">
                    <h3>Open Tickets</h3>
                    <p id="open-tickets">0</p>
                </div>
                <div class="stat-card">
                    <h3>Closed Tickets</h3>
                    <p id="closed-tickets">0</p>
                </div>
            </section>

            <section class="form-section">
                <h2>Create New Ticket</h2>
                <form id="ticket-form">
                    <label for="title">Title</label>
                    <input id="title" type="text" maxlength="200"
                           placeholder="Enter ticket title" required>

                    <label for="description">Description</label>
                    <textarea id="description"
                              placeholder="Describe the issue"
                              required></textarea>

                    <label for="priority">Priority</label>
                    <select id="priority">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>

                    <button type="submit">Create Ticket</button>
                </form>
            </section>

            <section class="tickets-section">
                <h2 id="tickets-heading">My Support Tickets</h2>

                <input id="search" type="search"
                       placeholder="Search tickets...">

                <p id="app-message" class="message" role="status"></p>
                <div id="ticket-list">
                    <p>Tickets will appear here.</p>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
