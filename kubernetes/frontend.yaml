apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddesk-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clouddesk-frontend
  template:
    metadata:
      labels:
        app: clouddesk-frontend
    spec:
      containers:
        - name: frontend
          image: clouddesk-frontend:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: clouddesk-frontend
spec:
  type: NodePort
  selector:
    app: clouddesk-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080