apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddesk-frontend
spec:
  replicas: 2

  # Update one replica at a time without creating extra pods.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: clouddesk-frontend

  template:
    metadata:
      labels:
        app: clouddesk-frontend
    spec:
      # Place frontend replicas on different Kubernetes nodes.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: clouddesk-frontend
              topologyKey: kubernetes.io/hostname

      containers:
        - name: frontend
          image: clouddesk-frontend:1.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: clouddesk-frontend
spec:
  selector:
    app: clouddesk-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
