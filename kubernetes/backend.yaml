apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddesk-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clouddesk-backend
  template:
    metadata:
      labels:
        app: clouddesk-backend
    spec:
      containers:
        - name: backend
          image: clouddesk-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: database-url
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: clouddesk-backend
spec:
  selector:
    app: clouddesk-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
