
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddesk-backend
spec:
  replicas: 2

  # Replace one replica at a time without creating extra pods.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: clouddesk-backend

  template:
    metadata:
      labels:
        app: clouddesk-backend
    spec:
      # Schedule backend replicas on different Kubernetes nodes.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: clouddesk-backend
              topologyKey: kubernetes.io/hostname

      containers:
        - name: backend
          image: clouddesk-backend:1.4
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            # PostgreSQL database connection.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: database-url

            # JWT secret used for login authentication.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clouddesk-auth-secret
                  key: jwt-secret

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: clouddesk-backend
spec:
  selector:
    app: clouddesk-backend

  ports:
    - port: 8000
      targetPort: 8000

  type: ClusterIP
